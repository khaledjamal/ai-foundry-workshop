# Lint, format and compile checks for the lab scripts (settings in ruff.toml) and the unit tests, on every push and
# pull request.
name: lint

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install ruff==0.17.1
      - run: ruff check .
      - run: ruff format --check .
      - run: python -m compileall -q src scripts tests

  # Unit tests of the shared HTTP logging helper against a local server (no Azure), with the HTTP libraries the
  # labs use, at the versions in requirements-labs.txt.
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install -e . requests==2.34.2 httpx2==2.13.1 httpx==0.28.1
      - run: python -m unittest discover -s tests -v
